## Version-claims registry — central side of the DEC-1 hybrid registry.
##
## Schema: data/schemas.yaml :: version-claims-registry.
##
## Each claim entry has:
##   id:                       (string, prefix vs-)
##   tool:                     (one of triton/cutlass/cuda/ptx/cute-dsl/cutile/tilelang/tilus/jax-pallas)
##   claim_valid_for:          (semver range, e.g. ">=3.6")
##   last_verified_release:    (must match a release name in data/tool-versions.yaml)
##   last_verified_at:         (ISO date)
##   applies_to:               (list of file paths or YAML JSON-pointers)
##   source_ids:               (list; each must resolve to a sources/**/*.md frontmatter id)
##   dev_branch_sha:           (required when claim_valid_for contains "dev")
##   notes:                    (optional)
##
## Wiki/reference pages and parsed YAML scalars in scope cite an entry by id
## via their `version_sensitive: <id>` pointer. The validator (task5) enforces
## that every per-page pointer resolves here AND every entry's `applies_to`
## paths exist + carry the matching pointer.

claims:
  - id: vs-triton-3.6-blackwell-tcgen05
    tool: triton
    claim_valid_for: ">=3.6"
    last_verified_release: "3.7.1"
    last_verified_at: 2026-08-13
    applies_to:
      - wiki/languages/triton-blackwell.md
      - references/primer.md
      - references/examples.md
      - data/inclusion-policy.yaml::triton.description
    source_ids:
      - doc-triton-3.7-blackwell
      - doc-triton-3.6-blackwell
      - doc-triton-pre36-blackwell
      - pr-vllm-29339
      - pr-sglang-22079
      - pr-sglang-21019
      - pr-sglang-5390
      - pr-sglang-21595
      - pr-pytorch-175826
    notes: |
      Tracks 3.6+ as the repository's conservative supported-policy floor for
      Blackwell (SM100) lowering paths through tcgen05.mma + TMEM
      (descriptor/TMA + warp_specialize on tl.dot, plus Gluon multi-CTA + 2CTA
      on tcgen05_mma_scaled). It is not an introduction boundary: official 3.4
      and 3.5 records already document Blackwell TMEM/tcgen05 and automatic
      warp-specialization work. Supporting evidence:
      data/triton-3.6-evidence.md memo plus the 3.6 and current 3.7.1 official
      release records. Triton 3.7.1 was verified as current on 2026-08-13.
      The formerly cited post-refresh anchor pr-vllm-34597 is an SM120 MLA
      backend change, not evidence for SM100 lowering. Post-refresh
      pr-vllm-29339 provides supplementary Triton 3.6 library dispatch scoped
      to [sm100, sm90] for MXFP4 dispatch-gate, merged 2025-11-24.
      Pre-refresh historical anchors retained as supplementary context:
      pr-sglang-22079 (Gemma4 NVFP4 Triton attention kernel doing real tl.dot
      matmul on [sm100, sm90], merged 2026-04-10), pr-sglang-21019
      (memory-rearrangement Triton kernel, merged 2026-03-23, no tl.dot and no
      exact architecture established by the captured material), pr-sglang-5390,
      pr-sglang-21595, pr-pytorch-175826 (ecosystem
      context). pr-sglang-22079 is the direct captured SM100-capable `tl.dot`
      kernel anchor. The strongest possible demonstrations of the 3.6 Blackwell-
      native paths (descriptor/TMA + warp_specialize, tl.dot_scaled, Gluon
      multi-CTA/2CTA) have NOT been found in any tracked-downstream merged
      PR locally; future refresh rounds should backfill such an anchor when
      one becomes available.
